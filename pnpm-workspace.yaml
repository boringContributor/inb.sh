packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@cloudflare/workers-types": ^5.20260930.2
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  zod: ^4.6.5
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
onlyBuiltDependencies:
  - esbuild
  - sst
  - workerd
